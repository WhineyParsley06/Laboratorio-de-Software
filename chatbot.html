<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliófilo — Asistente Lector · Librería Pereira</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════
       HU-25 — CHATBOT DE RECOMENDACIÓN CONVERSACIONAL CON IA
       Variables de tema del chatbot
    ══════════════════════════════════════════════════════════ */
    :root {
      --cb-bg:          #131009;
      --cb-surface:     #1c1711;
      --cb-surface2:    #221d14;
      --cb-border:      #33291e;
      --cb-border-soft: #2a2218;
      --cb-user-bg:     #7d1f17;
      --cb-user-edge:   #b83227;
      --cb-bot-bg:      #1e1810;
      --cb-bot-edge:    #3d3226;
      --ink:            #f2e9df;
      --ink-soft:       #c0afa0;
      --ink-dim:        #7a6a5c;
      --amber:          #e07a20;
      --amber-glow:     rgba(224,122,32,0.18);
      --amber-subtle:   rgba(224,122,32,0.08);
      --gold:           #c9a84c;
      --gold-dim:       rgba(201,168,76,0.15);
      --scroll-thumb:   #3a2e22;
      --chip-bg:        rgba(255,255,255,0.04);
      --chip-hover:     rgba(224,122,32,0.14);
    }

    body {
      background: var(--cb-bg) !important;
      background-image: none !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav { z-index: 200; }

    /* ── Layout principal ── */
    .cb-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 0;
      gap: 0;
    }

    /* ── Cabecera del chat ── */
    .cb-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      background: var(--cb-surface);
      border: 1px solid var(--cb-border);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      position: relative;
      overflow: hidden;
    }
    .cb-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 100% at 92% 50%,
        rgba(184,50,39,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .cb-avatar {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, #b83227, var(--amber));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 14px rgba(184,50,39,0.3);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .cb-header-info {
      position: relative;
      z-index: 1;
    }
    .cb-header-info h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--ink);
      font-weight: 700;
      margin-bottom: 2px;
      letter-spacing: -0.01em;
    }
    .cb-header-info p {
      font-size: 0.74rem;
      color: var(--ink-dim);
    }
    .cb-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.73rem;
      color: var(--ink-dim);
      position: relative;
      z-index: 1;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .status-dot.loading { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .status-dot.error   { background: #ef4444; box-shadow: 0 0 6px #ef4444; animation: none; }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Barra de contexto del usuario ── */
    .cb-ctx-bar-wrap {
      background: var(--cb-surface);
      border: 1px solid var(--cb-border);
      border-top: none;
      border-bottom: none;
      padding: 8px 18px;
    }
    .cb-ctx-bar {
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 0.74rem;
      color: var(--gold);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .ctx-chip {
      background: rgba(201,168,76,0.1);
      padding: 3px 9px;
      border-radius: 99px;
      white-space: nowrap;
      font-size: 0.72rem;
    }
    .ctx-privacy-note {
      margin-left: auto;
      opacity: 0.65;
      font-size: 0.69rem;
      font-style: italic;
    }

    /* ── Ventana de mensajes ── */
    .cb-messages {
      flex: 1;
      min-height: 400px;
      max-height: calc(100vh - 360px);
      overflow-y: auto;
      padding: 18px 18px 8px;
      background: var(--cb-surface);
      border: 1px solid var(--cb-border);
      border-top: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .cb-messages::-webkit-scrollbar { width: 4px; }
    .cb-messages::-webkit-scrollbar-track { background: transparent; }
    .cb-messages::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 99px; }

    /* ── Mensajes ── */
    .msg {
      display: flex;
      gap: 9px;
      animation: msgIn 0.25s cubic-bezier(.25,.8,.25,1);
      max-width: 100%;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .msg.bot  .msg-icon { background: linear-gradient(135deg, #b83227, var(--amber)); }
    .msg.user .msg-icon { background: var(--cb-surface2); border: 1px solid var(--cb-border); }

    .msg-bubble {
      max-width: 80%;
      padding: 11px 15px;
      font-size: 0.875rem;
      line-height: 1.65;
      position: relative;
    }
    .msg.bot .msg-bubble {
      background: var(--cb-bot-bg);
      border: 1px solid var(--cb-bot-edge);
      color: var(--ink);
      border-radius: 4px 14px 14px 14px;
    }
    .msg.user .msg-bubble {
      background: var(--cb-user-bg);
      border: 1px solid var(--cb-user-edge);
      color: #f8ede8;
      border-radius: 14px 4px 14px 14px;
    }

    /* Rich text dentro de burbuja bot */
    .msg.bot .msg-bubble strong { color: var(--gold); font-weight: 600; }
    .msg.bot .msg-bubble em { color: var(--ink-soft); font-style: italic; }

    /* Tarjeta de libro recomendado */
    .book-card {
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--cb-border);
      border-left: 3px solid var(--amber);
      border-radius: 0 10px 10px 0;
      padding: 10px 13px;
      margin: 10px 0 4px;
      font-size: 0.83rem;
      transition: border-left-color 0.2s;
    }
    .book-card:hover { border-left-color: var(--gold); }
    .book-card-spine {
      width: 4px;
      background: linear-gradient(180deg, var(--amber), var(--gold));
      border-radius: 2px;
      flex-shrink: 0;
      display: none; /* ya tenemos el border-left */
    }
    .book-card-body { flex: 1; }
    .book-card-title {
      font-family: 'Lora', serif;
      font-weight: 600;
      color: var(--ink);
      font-size: 0.9rem;
      display: block;
      margin-bottom: 2px;
    }
    .book-card-meta {
      color: var(--ink-dim);
      font-size: 0.76rem;
      display: block;
      margin-bottom: 5px;
    }
    .book-card-why {
      color: var(--ink-soft);
      font-size: 0.8rem;
      font-style: italic;
      line-height: 1.5;
    }
    .book-card-price {
      font-size: 0.75rem;
      color: var(--amber);
      font-weight: 600;
      margin-top: 4px;
      display: block;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 15px;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--amber);
      animation: typeBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typeBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.5; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* Estado de carga de contexto */
    .ctx-loading {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-dim);
    }
    .ctx-loading .spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--cb-border);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    .ctx-loading p { font-size: 0.84rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Zona de entrada ── */
    .cb-input-area {
      background: var(--cb-surface);
      border: 1px solid var(--cb-border);
      border-top: 1px solid rgba(255,255,255,0.055);
      border-radius: 0 0 18px 18px;
      padding: 14px 18px 18px;
    }

    /* Sugerencias rápidas */
    .quick-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 11px;
    }
    .quick-chip {
      background: var(--chip-bg);
      border: 1px solid var(--cb-border);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 0.76rem;
      color: var(--ink-dim);
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }
    .quick-chip:hover {
      background: var(--chip-hover);
      border-color: var(--amber);
      color: var(--ink);
    }

    .cb-form {
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }
    .cb-textarea {
      flex: 1;
      background: #0e0c09;
      border: 1.5px solid var(--cb-border);
      border-radius: 13px;
      padding: 11px 15px;
      color: var(--ink);
      font-size: 0.875rem;
      font-family: 'DM Sans', sans-serif;
      resize: none;
      min-height: 46px;
      max-height: 130px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s;
      overflow-y: auto;
    }
    .cb-textarea::placeholder { color: var(--ink-dim); opacity: 0.55; }
    .cb-textarea:focus { border-color: var(--amber); }
    .cb-textarea::-webkit-scrollbar { width: 3px; }
    .cb-textarea::-webkit-scrollbar-thumb { background: var(--scroll-thumb); }

    .btn-send {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: linear-gradient(135deg, #b83227, var(--amber));
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 14px rgba(184,50,39,0.3);
      transition: all 0.2s;
      flex-shrink: 0;
      color: #fff;
    }
    .btn-send:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(184,50,39,0.45);
    }
    .btn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .cb-hint {
      font-size: 0.7rem;
      color: var(--ink-dim);
      margin-top: 7px;
      text-align: center;
      opacity: 0.65;
    }

    /* Separador de fecha/sesión */
    .msg-divider {
      text-align: center;
      font-size: 0.7rem;
      color: var(--ink-dim);
      padding: 4px 0;
      position: relative;
    }
    .msg-divider::before, .msg-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30%;
      height: 1px;
      background: var(--cb-border);
    }
    .msg-divider::before { left: 0; }
    .msg-divider::after  { right: 0; }

    /* Mensaje de error inline */
    .msg-error {
      font-size: 0.81rem;
      color: #ef4444;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 9px 13px;
    }

    /* Footer */
    footer {
      background: var(--cb-bg) !important;
      color: var(--ink-dim) !important;
      border-top: 1px solid var(--cb-border) !important;
      padding: 13px 20px !important;
      font-size: 0.72rem !important;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 600px) {
      .cb-shell { padding: 10px 8px 0; }
      .msg-bubble { max-width: 88%; font-size: 0.83rem; }
      .cb-header { padding: 13px 14px; }
      .cb-ctx-bar-wrap { padding: 7px 12px; }
      .quick-row { gap: 5px; }
      .quick-chip { font-size: 0.72rem; padding: 4px 10px; }
    }
  </style>
</head>
<body>
    <span>Sesión activa: <strong id="sessionCount">60s</strong></span>
  </div>

  <div class="cb-shell">

    <!-- ── Cabecera ── -->
    <div class="cb-header">
      <div class="cb-avatar">📖</div>
      <div class="cb-header-info">
        <h2>Bibliófilo — Tu asistente de lectura</h2>
        <p>Recomendaciones basadas únicamente en <em>tu</em> historial · Sin sesgos externos</p>
      </div>
      <div class="cb-status" id="cbStatus">
        <div class="status-dot loading" id="statusDot"></div>
        <span id="statusText">Cargando tu perfil…</span>
      </div>
    </div>

    <!-- ── Barra de contexto del usuario ── -->
    <div class="cb-ctx-bar-wrap" id="ctxBarWrap" style="display:none;">
      <div class="cb-ctx-bar" id="ctxBar"></div>
    </div>

    <!-- ── Ventana de mensajes ── -->
    <div class="cb-messages" id="cbMessages">
      <div class="ctx-loading" id="ctxLoading">
        <div class="spinner"></div>
        <p>Leyendo tu historial personal de lectura…</p>
      </div>
    </div>

    <!-- ── Zona de entrada ── -->
    <div class="cb-input-area">
      <!-- Sugerencias conversacionales (no son menús rígidos, son disparadores de diálogo) -->
      <div class="quick-row" id="quickRow">
        <button class="quick-chip" onclick="sendQuick('¿Qué libro me recomiendas leer ahora?')">¿Qué leo ahora?</button>
        <button class="quick-chip" onclick="sendQuick('Recomiéndame algo parecido a lo que ya he comprado')">Similar a lo que compré</button>
        <button class="quick-chip" onclick="sendQuick('¿Hay novedades que encajen con mis gustos?')">Novedades para mí</button>
        <button class="quick-chip" onclick="sendQuick('¿En qué géneros me he enfocado más?')">Mis géneros</button>
        <button class="quick-chip" onclick="sendQuick('Tengo ganas de algo diferente a lo que he leído antes')">Algo diferente</button>
      </div>
      <div class="cb-form">
        <textarea
          class="cb-textarea"
          id="cbInput"
          placeholder="Cuéntame qué tienes en mente — géneros, autores, estado de ánimo…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
          disabled
        ></textarea>
        <button class="btn-send" id="btnSend" onclick="sendMessage()" disabled title="Enviar">
          ➤
        </button>
      </div>
      <p class="cb-hint">Enter para enviar · Shift+Enter para nueva línea</p>
    </div>

  </div>

 <script src="js/script.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════
//  HU-25 — Chatbot de Recomendación por Reglas (sin API externa)
// ══════════════════════════════════════════════════════════════════════════

const sesion = requireSession();
if (sesion) initSessionTimer();
actualizarBadgeCarrito?.();

let userCtx        = null;
let isLoading      = false;
let catalogoGlobal = [];

// ── UTILIDADES DE UI ─────────────────────────────────────────────────────

function setStatus(type, text) {
  const dot  = document.getElementById('statusDot');
  const span = document.getElementById('statusText');
  dot.className    = 'status-dot ' + (type === 'ok' ? '' : type);
  span.textContent = text;
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMessage(role, html) {
  const wrap = document.getElementById('cbMessages');
  const div  = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.innerHTML  = role === 'user'
    ? `<div class="msg-bubble">${escHtml(html)}</div><div class="msg-icon user-icon">👤</div>`
    : `<div class="msg-icon">📖</div><div class="msg-bubble">${html}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function showTyping() {
  const wrap = document.getElementById('cbMessages');
  const div  = document.createElement('div');
  div.className = 'msg bot typing-indicator';
  div.id        = 'typingMsg';
  div.innerHTML = `<div class="msg-icon">📖</div><div class="msg-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() { document.getElementById('typingMsg')?.remove(); }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendQuick(text) {
  document.getElementById('cbInput').value = text;
  sendMessage();
}

// ── CARGAR DATOS DE SUPABASE ─────────────────────────────────────────────

async function buildUserContext() {
  const uid = sesion.id;

  const { data: perfil } = await client
    .from('usuarios').select('nombre').eq('id', uid).single();

  const { data: comprasRaw } = await client
    .from('compras').select('id').eq('usuario_id', uid);

  const compraIds = (comprasRaw || []).map(c => c.id);

  let comprados = [];
  if (compraIds.length) {
    const { data: itemsRaw } = await client
      .from('compras_items')
      .select('cantidad, libros(id, titulo, autor, genero, precio)')
      .in('compra_id', compraIds);

    comprados = (itemsRaw || [])
      .filter(i => i.libros)
      .map(i => ({ ...i.libros, cantidad: i.cantidad || 1 }));
  }

  const { data: catalogo } = await client
    .from('libros')
    .select('id, titulo, autor, genero, precio, imagen_url')
    .eq('agotado', false)
    .order('creado_en', { ascending: false });

  catalogoGlobal = catalogo || [];

  const generoCount = {};
  const autorCount  = {};
  const idsComprados = new Set();

  for (const l of comprados) {
    idsComprados.add(l.id);
    if (l.genero) generoCount[l.genero] = (generoCount[l.genero] || 0) + l.cantidad;
    if (l.autor)  autorCount[l.autor]   = (autorCount[l.autor]  || 0) + 1;
  }

  const generosOrdenados = Object.entries(generoCount).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const autoresOrdenados = Object.entries(autorCount).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);

  return { nombre: perfil?.nombre || sesion.nombre || 'Lector', comprados,
           generosOrdenados, autoresOrdenados, idsComprados, totalLibros: comprados.length };
}

// ── MOTOR DE REGLAS ──────────────────────────────────────────────────────

function recomendar(cantidad = 3, soloGenero = null, excluirGeneros = []) {
  let pool = catalogoGlobal.filter(l => !userCtx.idsComprados.has(l.id));
  if (soloGenero)          pool = pool.filter(l => l.genero === soloGenero);
  if (excluirGeneros.length) pool = pool.filter(l => !excluirGeneros.includes(l.genero));

  pool.sort((a, b) => {
    const iA = userCtx.generosOrdenados.indexOf(a.genero);
    const iB = userCtx.generosOrdenados.indexOf(b.genero);
    return (iA === -1 ? 99 : iA) - (iB === -1 ? 99 : iB);
  });
  return pool.slice(0, cantidad);
}

function renderLibros(libros) {
  if (!libros.length) return '<em>No encontré títulos disponibles con ese criterio.</em>';
  return libros.map(l => `
    <div style="border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;margin:8px 0;background:rgba(255,255,255,0.04);">
      <strong>📗 ${escHtml(l.titulo)}</strong><br>
      <span style="opacity:.75;font-size:0.88rem;">${escHtml(l.autor)}${l.genero?' · '+escHtml(l.genero):''}</span><br>
      <span style="color:var(--gold,#c9a84c);font-weight:600;font-size:0.9rem;">$${parseFloat(l.precio||0).toLocaleString('es-CO')} COP</span>
    </div>`).join('');
}

function generarRespuesta(msg) {
  const t   = msg.toLowerCase();
  const ctx = userCtx;
  const g0  = ctx.generosOrdenados[0];
  const a0  = ctx.autoresOrdenados[0];

  if (!ctx.totalLibros) {
    if (/recomien|qué leo|sugi|novedad/.test(t))
      return `Aún no tienes compras, pero aquí van nuestras novedades:<br>${renderLibros(catalogoGlobal.slice(0,3))}`;
    return `Todavía no tengo tu historial. Visita el <a href="catalogo.html">catálogo</a> y haz tu primera compra para que pueda recomendarte con precisión. 😊`;
  }

  if (/hola|buenas|hey|saludos/.test(t))
    return `¡Hola, <strong>${ctx.nombre}</strong>! ¿Qué buscas hoy? Puedo recomendarte libros, mostrarte novedades o hablar de tus géneros favoritos.`;

  if (/graci|genial|perfecto|excelente/.test(t))
    return `¡Con gusto, ${ctx.nombre}! 😊 Aquí estaré cuando necesites más recomendaciones.`;

  if (/qué leo|recomienda|sugi|próxim|siguiente/.test(t)) {
    const libros = recomendar(3);
    return `Basándome en tu historial${g0?' (te gusta el <strong>'+g0+'</strong>)':''}, te recomiendo:<br>${renderLibros(libros)}`;
  }

  if (/similar|pareci|mismo estilo|como lo que/.test(t)) {
    const libros = g0 ? recomendar(3, g0) : recomendar(3);
    return g0
      ? `Ya que te gusta <strong>${g0}</strong>, aquí hay más del mismo género:<br>${renderLibros(libros)}`
      : `Aquí hay títulos similares a tus compras:<br>${renderLibros(libros)}`;
  }

  if (/novedad|nuevo|reciente|estreno/.test(t)) {
    const nuevos = catalogoGlobal.filter(l=>!ctx.idsComprados.has(l.id)).slice(0,3);
    return `Novedades recientes de la librería:<br>${renderLibros(nuevos)}`;
  }

  if (/género|categoría|tipo de libro|estilo/.test(t)) {
    if (!ctx.generosOrdenados.length) return 'Aún no tengo suficiente historial para identificar tus géneros favoritos.';
    const lista = ctx.generosOrdenados.slice(0,5).map((g,i)=>`${i+1}. <strong>${g}</strong>`).join('<br>');
    return `Tus géneros más leídos son:<br>${lista}<br><br>¿Quieres que te recomiende libros de alguno en particular?`;
  }

  if (/diferente|cambio|otro género|algo nuevo|explorar/.test(t)) {
    const libros = recomendar(3, null, ctx.generosOrdenados.slice(0,2));
    return `¡Buena idea explorar algo nuevo! Títulos de géneros que no has leído:<br>${renderLibros(libros)}`;
  }

  if (/autor|escritor/.test(t)) {
    if (!a0) return 'No tengo autores registrados en tu historial todavía.';
    const porAutor = catalogoGlobal.filter(l=>l.autor===a0 && !ctx.idsComprados.has(l.id)).slice(0,3);
    return porAutor.length
      ? `Tu autor más leído es <strong>${a0}</strong>. Otros libros disponibles:<br>${renderLibros(porAutor)}`
      : `Ya tienes todos los libros disponibles de <strong>${a0}</strong>. ¿Te exploro un autor similar?`;
  }

  if (/precio|barato|económico|presupuesto/.test(t)) {
    const baratos = catalogoGlobal
      .filter(l=>!ctx.idsComprados.has(l.id))
      .sort((a,b)=>parseFloat(a.precio||0)-parseFloat(b.precio||0))
      .slice(0,3);
    return `Opciones más accesibles del catálogo:<br>${renderLibros(baratos)}`;
  }

  // Default
  const sugeridos = recomendar(2);
  return `No entendí bien tu pregunta, pero aquí van un par de sugerencias según tu historial:<br>${renderLibros(sugeridos)}<br><br>Puedes preguntarme por <em>recomendaciones, novedades, géneros, autores o precios</em>.`;
}

// ── ENVÍO DE MENSAJES ────────────────────────────────────────────────────

async function sendMessage() {
  if (isLoading || !userCtx) return;
  const input = document.getElementById('cbInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('btnSend').disabled = true;
  input.disabled = true;
  document.getElementById('quickRow').style.display = 'none';

  addMessage('user', text);
  showTyping();
  setStatus('loading', 'Pensando…');

  await new Promise(r => setTimeout(r, 500 + Math.random() * 400));

  removeTyping();
  addMessage('bot', generarRespuesta(text));
  setStatus('ok', 'En línea');

  isLoading = false;
  document.getElementById('btnSend').disabled = false;
  input.disabled = false;
  input.focus();
}

// ── INICIALIZACIÓN ───────────────────────────────────────────────────────

async function init() {
  if (!sesion) return;
  try {
    userCtx = await buildUserContext();
    document.getElementById('ctxLoading')?.remove();

    if (userCtx.generosOrdenados.length) {
      document.getElementById('ctxBarWrap').style.display = 'block';
      document.getElementById('ctxBar').innerHTML =
        userCtx.generosOrdenados.slice(0,4).map(g=>`<span class="ctx-chip">${escHtml(g)}</span>`).join('');
    }

    const g0 = userCtx.generosOrdenados[0];
    const welcome = userCtx.totalLibros === 0
      ? `¡Hola, <strong>${escHtml(userCtx.nombre)}</strong>! Soy <strong>Bibliófilo</strong> 📚<br>Aún no tienes compras, pero puedo mostrarte novedades. ¿Qué te llama la atención?`
      : `¡Hola de nuevo, <strong>${escHtml(userCtx.nombre)}</strong>! 📖<br>Tienes <strong>${userCtx.totalLibros} libro${userCtx.totalLibros!==1?'s':''}</strong> comprados${g0?' y tu género favorito es <strong>'+escHtml(g0)+'</strong>':''}.<br><br>¿Qué buscas hoy?`;

    addMessage('bot', welcome);
    setStatus('ok', 'En línea');
    document.getElementById('cbInput').disabled = false;
    document.getElementById('btnSend').disabled  = false;
    document.getElementById('cbInput').focus();

  } catch(e) {
    console.error('Chatbot init error:', e);
    setStatus('error', 'Error al cargar perfil');
    document.getElementById('ctxLoading').innerHTML =
      `<p style="color:#ef4444;">⚠️ No se pudo cargar tu perfil. Recarga la página.</p>`;
  }
}

init();
</script>
